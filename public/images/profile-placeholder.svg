<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Placeholder portrait">
  <title>Placeholder portrait — replace with a real photograph</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="45%" stop-color="#15203a"/>
      <stop offset="100%" stop-color="#241a3d"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="28%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="78%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="figure" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#e2e8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3d8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#grid)"/>
  <rect width="640" height="800" fill="url(#bloomA)"/>
  <rect width="640" height="800" fill="url(#bloomB)"/>

  <!-- Soft halo behind the figure -->
  <ellipse cx="320" cy="330" rx="150" ry="155" fill="#22d3ee" opacity="0.18" filter="url(#soft)"/>

  <!-- Abstract head & shoulders -->
  <g>
    <circle cx="320" cy="300" r="104" fill="url(#figure)"/>
    <path d="M136 800c0-110 82.4-186 184-186s184 76 184 186Z" fill="url(#figure)"/>
  </g>

  <!-- Node accents, echoing the site's neural field -->
  <g fill="#22d3ee">
    <circle cx="132" cy="168" r="4" opacity="0.85"/>
    <circle cx="516" cy="232" r="3.5" opacity="0.7"/>
    <circle cx="92" cy="452" r="3" opacity="0.6"/>
    <circle cx="556" cy="520" r="4.5" opacity="0.75"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.4">
    <line x1="132" y1="168" x2="516" y2="232"/>
    <line x1="92" y1="452" x2="556" y2="520"/>
  </g>

  <!-- Caption -->
  <rect x="0" y="704" width="640" height="96" fill="#05060c" opacity="0.62"/>
  <rect x="48" y="724" width="64" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="48" y="762" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" letter-spacing="3" fill="#eef1fb" opacity="0.92">PLACEHOLDER</text>
  <text x="48" y="784" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#9aa3bf">Replace with portrait — /images/profile.jpg</text>
  <text x="592" y="762" text-anchor="end" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="700" fill="#eef1fb" opacity="0.28">VG</text>
</svg>
