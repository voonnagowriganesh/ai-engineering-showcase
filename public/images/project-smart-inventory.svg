<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="960" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f1ff"/>
      <stop offset="1" stop-color="#ede4ff"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg1)"/>
  <circle cx="140" cy="90" r="150" fill="#d8b4fe" opacity="0.25"/>
  <circle cx="860" cy="340" r="180" fill="#c4b5fd" opacity="0.2"/>

  <!-- warehouse shelf with stacked boxes -->
  <g transform="translate(150,120)">
    <rect x="0" y="0" width="230" height="190" rx="16" fill="#ffffff" opacity="0.75"/>
    <rect x="22" y="24" width="70" height="60" rx="8" fill="url(#accent1)"/>
    <rect x="104" y="24" width="70" height="60" rx="8" fill="#c4b5fd"/>
    <rect x="22" y="96" width="70" height="60" rx="8" fill="#c4b5fd"/>
    <rect x="104" y="96" width="70" height="60" rx="8" fill="url(#accent1)"/>
    <rect x="186" y="60" width="26" height="96" rx="6" fill="#e9d5ff"/>
  </g>

  <!-- dashed dispatch route -->
  <path d="M 400 230 C 500 230, 520 150, 620 150" stroke="#a855f7" stroke-width="4" stroke-dasharray="10 10" fill="none" opacity="0.7"/>

  <!-- delivery truck -->
  <g transform="translate(630,150)">
    <rect x="0" y="40" width="160" height="70" rx="12" fill="#ffffff" opacity="0.85"/>
    <rect x="12" y="52" width="90" height="46" rx="8" fill="url(#accent1)"/>
    <path d="M110 60 h36 l24 26 v22 h-60 z" fill="#c4b5fd"/>
    <circle cx="40" cy="118" r="16" fill="#581c87"/>
    <circle cx="130" cy="118" r="16" fill="#581c87"/>
    <circle cx="40" cy="118" r="6" fill="#f5f1ff"/>
    <circle cx="130" cy="118" r="6" fill="#f5f1ff"/>
  </g>

  <!-- small floating package dots -->
  <rect x="520" y="90" width="26" height="26" rx="6" fill="#a855f7" opacity="0.5"/>
  <rect x="560" y="70" width="18" height="18" rx="5" fill="#7c3aed" opacity="0.4"/>
</svg>
