<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="960" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg5)"/>
  <circle cx="140" cy="100" r="150" fill="#fbcfe8" opacity="0.3"/>
  <circle cx="840" cy="340" r="170" fill="#f9a8d4" opacity="0.25"/>

  <!-- bar chart card -->
  <g transform="translate(260,110)">
    <rect x="0" y="0" width="260" height="190" rx="18" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="120" width="30" height="40" rx="6" fill="#f9a8d4"/>
    <rect x="72" y="90" width="30" height="70" rx="6" fill="url(#accent5)"/>
    <rect x="114" y="60" width="30" height="100" rx="6" fill="#f472b6"/>
    <rect x="156" y="100" width="30" height="60" rx="6" fill="#f9a8d4"/>
    <rect x="198" y="40" width="30" height="120" rx="6" fill="url(#accent5)"/>
    <path d="M30 150 L90 100 L130 112 L180 70 L213 50" stroke="#db2777" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="213" cy="50" r="6" fill="#db2777"/>
  </g>

  <!-- magnifying glass overlay -->
  <g transform="translate(560,150)">
    <circle cx="60" cy="60" r="58" fill="none" stroke="url(#accent5)" stroke-width="16"/>
    <line x1="100" y1="100" x2="160" y2="160" stroke="url(#accent5)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="34" fill="#fdf2f8" opacity="0.6"/>
  </g>

  <!-- scatter dots -->
  <circle cx="470" cy="80" r="8" fill="#f472b6" opacity="0.7"/>
  <circle cx="520" cy="60" r="6" fill="#db2777" opacity="0.6"/>
  <circle cx="500" cy="110" r="5" fill="#f9a8d4" opacity="0.8"/>
</svg>
