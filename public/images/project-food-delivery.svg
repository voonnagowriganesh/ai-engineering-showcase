<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="960" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg4)"/>
  <circle cx="830" cy="330" r="170" fill="#fde68a" opacity="0.35"/>
  <circle cx="120" cy="70" r="140" fill="#fcd34d" opacity="0.25"/>

  <!-- food bag -->
  <g transform="translate(220,120)">
    <path d="M10 50 h180 l-14 140 a16 16 0 0 1 -16 14 H40 a16 16 0 0 1 -16 -14 Z" fill="url(#accent4)"/>
    <path d="M40 50 v-18 a60 60 0 0 1 120 0 v18" stroke="#92400e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="62" y="96" width="76" height="12" rx="6" fill="#fffbeb" opacity="0.85"/>
    <rect x="62" y="120" width="56" height="12" rx="6" fill="#fffbeb" opacity="0.7"/>
    <!-- steam -->
    <path d="M70 30 q10 -20 0 -40" stroke="#fcd34d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M100 30 q10 -20 0 -40" stroke="#fcd34d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M130 30 q10 -20 0 -40" stroke="#fcd34d" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- delivery scooter -->
  <g transform="translate(540,190)">
    <rect x="0" y="0" width="230" height="130" rx="16" fill="#ffffff" opacity="0.85"/>
    <circle cx="50" cy="96" r="20" fill="#78350f"/>
    <circle cx="160" cy="96" r="20" fill="#78350f"/>
    <path d="M50 96 h80 l20 -34 h30" stroke="url(#accent4)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="40" width="40" height="30" rx="8" fill="url(#accent4)"/>
    <path d="M30 96 h0" />
    <!-- speed lines -->
    <path d="M-10 70 h30" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <path d="M-16 86 h26" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- location pin -->
  <g transform="translate(470,80)">
    <path d="M0 0 C-22 0 -38 16 -38 36 C-38 62 0 96 0 96 C0 96 38 62 38 36 C38 16 22 0 0 0 Z" fill="url(#accent4)"/>
    <circle cx="0" cy="34" r="14" fill="#fffbeb"/>
  </g>
</svg>
