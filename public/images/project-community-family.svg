  <g transform="translate(540,110)">
    <rect x="0" y="0" width="240" height="190" rx="18" fill="#ffffff" opacity="0.9"/>
    <rect x="28" y="28" width="90" height="90" rx="12" fill="#cffafe"/>
    <circle cx="73" cy="60" r="18" fill="url(#accent2)"/>
    <rect x="55" y="82" width="36" height="24" rx="8" fill="url(#accent2)"/>
    <rect x="136" y="34" width="76" height="10" rx="5" fill="#a5f3fc"/>
    <rect x="136" y="56" width="60" height="10" rx="5" fill="#a5f3fc"/>
    <rect x="28" y="140" width="184" height="10" rx="5" fill="#cffafe"/>
    <rect x="28" y="160" width="130" height="10" rx="5" fill="#cffafe"/>
    <circle cx="200" cy="165" r="14" fill="#22d3ee"/>
