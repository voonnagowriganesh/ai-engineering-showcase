  </defs>
  <rect width="960" height="420" fill="url(#bg2)"/>
  <circle cx="820" cy="80" r="160" fill="#a5f3fc" opacity="0.3"/>
  <circle cx="120" cy="360" r="150" fill="#67e8f9" opacity="0.2"/>

  <!-- family group: two adults + child, simple flat silhouettes -->
