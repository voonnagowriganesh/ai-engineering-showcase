<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060c"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#140f28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="bloomA" cx="18%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="86%" cy="86%" r="56%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bloomA)"/>
  <rect width="1200" height="630" fill="url(#bloomB)"/>

  <!-- Neural accents -->
  <g stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="92" y1="96" x2="268" y2="186"/>
    <line x1="268" y1="186" x2="176" y2="330"/>
    <line x1="1020" y1="140" x2="1116" y2="268"/>
    <line x1="958" y1="486" x2="1108" y2="432"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="92" cy="96" r="5"/>
    <circle cx="268" cy="186" r="4"/>
    <circle cx="176" cy="330" r="3.5" opacity="0.8"/>
    <circle cx="1020" cy="140" r="4.5"/>
    <circle cx="1116" cy="268" r="3.5" opacity="0.8"/>
    <circle cx="958" cy="486" r="4"/>
    <circle cx="1108" cy="432" r="3" opacity="0.7"/>
  </g>

  <!-- Monogram -->
  <rect x="88" y="196" width="76" height="76" rx="20" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M106 216 L126 252 L146 216" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eyebrow -->
  <text x="184" y="243" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" letter-spacing="5.5" fill="#9aa3bf">AI DEVELOPER</text>

  <!-- Headline -->
  <text x="88" y="378" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-2.5" fill="#eef1fb">Building Intelligent</text>
  <text x="88" y="466" font-family="'Space Grotesk', system-ui, sans-serif" font-size="82" font-weight="700" letter-spacing="-2.5" fill="url(#accent)">Products with AI.</text>

  <!-- Rule -->
  <rect x="88" y="512" width="132" height="4" rx="2" fill="url(#accent)"/>

  <!-- Name + stack -->
  <text x="88" y="566" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="600" fill="#eef1fb">Voonna Gowri Ganesh</text>
  <text x="88" y="598" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" letter-spacing="1.5" fill="#666e8c">Python · FastAPI · LangGraph · React · PostgreSQL</text>
</svg>
