    <!--
      Theme bootstrap. Runs before the stylesheet paints so the correct palette
      is applied on the very first frame — without this the page would flash the
      default theme before React mounts.
      Keep the storage key and attribute in sync with ThemeService.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vgg.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#04120a' : '#f7f6f0';
        } catch (error) {
          /* Blocked storage — the default dark theme in the markup stands. */
        }
      })();
    </script>


    <!--
      Zero-JS boot screen. The React preloader cannot paint until the bundle has
      downloaded and mounted, which on a slow connection leaves several seconds
      of blank page. This paints with the first HTML bytes and is removed by the
      app on mount, so the two overlap rather than flash.
      Styles are inline on purpose: an external stylesheet would be one more
      round trip before anything appears.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #04120a;
        font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      html[data-theme='light'] #boot {
        background: #f7f6f0;
      }
      #boot[hidden] {
        display: none;
      }
      #boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        border: 1px solid rgba(16, 185, 129, 0.4);
        background: #071c10;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background-image: linear-gradient(135deg, #fbbf24, #34d399, #10b981);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        box-shadow: 0 0 40px -8px rgba(16, 185, 129, 0.5);
      }
      html[data-theme='light'] #boot-mark {
        background-color: #ffffff;
        border-color: rgba(16, 185, 129, 0.3);
        background-image: linear-gradient(135deg, #d97706, #059669, #10b981);
      }
      #boot-rail {
        position: relative;
        width: min(22rem, 70vw);
        height: 1px;
        overflow: hidden;
        background: #143823;
      }
      html[data-theme='light'] #boot-rail {
        background: #dfdacb;
      }
      #boot-rail::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #10b981, #34d399, transparent);
        animation: boot-sweep 1.15s ease-in-out infinite;
      }
      #boot-label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #726ea8;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-rail::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
